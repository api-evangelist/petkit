name: petkit
description: >-
  PetKit is a consumer smart pet-technology company that designs and sells
  connected pet-care hardware — automated feeders, smart water fountains,
  self-cleaning litter boxes, cameras, and health-monitoring accessories —
  paired with the PetKit mobile app that controls the devices over the cloud.
  It was surfaced as a portfolio company of the venture firm qiming and added to
  the API Evangelist network as a stub for enrichment. As of this enrichment
  pass, PetKit publishes no dedicated first-party developer portal or public
  API; petkit.com is operated as a Shopify storefront, so the only machine
  discoverable surface on the domain is Shopify's Customer Account OAuth/OIDC
  discovery documents. Third-party (community, reverse-engineered) integrations
  exist for the mobile-app backend but there is no officially documented API.
